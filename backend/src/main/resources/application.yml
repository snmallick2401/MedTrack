spring:
  application.name: medtrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medtrack}
    username: ${DB_USERNAME:medtrack}
    password: ${DB_PASSWORD:medtrack}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  servlet.context-path: /
  error.include-message: never
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
medtrack:
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-to-a-minimum-of-32-characters}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui.html
