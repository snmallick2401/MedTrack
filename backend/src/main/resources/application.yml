spring:
  application.name: medtrack
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medtrack}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:medtrack}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:medtrack}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: ${DB_POOL_MIN:1}
      idle-timeout: 30000
      max-lifetime: 60000
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
  servlet.context-path: /
  error.include-message: never
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
medtrack:
  cookie.secure: ${MEDTRACK_COOKIE_SECURE:false}
  jwt:
    secret: ${MEDTRACK_JWT_SECRET:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,https://*}
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui.html
