services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medtrack}
      POSTGRES_USER: ${POSTGRES_USER:-medtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medtrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medtrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  medtrack-postgres-data:
