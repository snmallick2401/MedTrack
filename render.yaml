services:
  # Spring Boot 4.1.1 Backend Web Service
  - type: web
    name: medtrack-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Free is suitable for testing only; upgrade this service for production.
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medtrack-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: medtrack-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: medtrack-postgres
          property: password
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: MEDTRACK_JWT_SECRET
        generateValue: true
      - key: MEDTRACK_JWT_EXPIRATION_MS
        value: "900000"
      - key: MEDTRACK_COOKIE_SECURE
        value: "true"

  # React 19 + Vite 6 Frontend Static Site
  - type: web
    name: medtrack-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: medtrack-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # Managed PostgreSQL Database
  - name: medtrack-postgres
    # Free PostgreSQL expires after 30 days and has no backups; use a paid plan for production.
    plan: free
    databaseName: medtrack
    user: medtrack
