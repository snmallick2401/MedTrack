services:
  # Spring Boot 4.1.1 Backend Web Service
  - type: web
    name: medtrack-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Free is suitable for testing only; upgrade this service for production.
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: medtrack-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: medtrack-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: medtrack-postgres
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: medtrack-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: medtrack-postgres
          property: password
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: MEDTRACK_JWT_SECRET
        generateValue: true
      - key: MEDTRACK_JWT_EXPIRATION_MS
        value: "900000"
      - key: MEDTRACK_COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: medtrack-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # React 19 + Vite 6 Frontend Static Site
  - type: web
    name: medtrack-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: medtrack-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # Managed PostgreSQL Database
  - name: medtrack-postgres
    # Free PostgreSQL expires after 30 days and has no backups; use a paid plan for production.
    plan: free
    postgresMajorVersion: "18"
    databaseName: medtrack
    user: medtrack
    ipAllowList: []
