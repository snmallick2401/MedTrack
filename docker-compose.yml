services:
  postgres:
    image: postgres:18-alpine
    container_name: medtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medtrack}
      POSTGRES_USER: ${POSTGRES_USER:-medtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medtrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medtrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medtrack-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medtrack}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medtrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-medtrack}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      MEDTRACK_JWT_SECRET: ${MEDTRACK_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      MEDTRACK_JWT_EXPIRATION_MS: ${MEDTRACK_JWT_EXPIRATION_MS:-900000}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medtrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  medtrack-postgres-data: