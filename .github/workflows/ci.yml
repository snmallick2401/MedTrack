name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Backend Build & Test (Java 25)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medtrack
          POSTGRES_USER: medtrack
          POSTGRES_PASSWORD: medtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run Backend Tests & Package
        working-directory: ./backend
        run: mvn clean test package -DskipTests=false
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/medtrack
          SPRING_DATASOURCE_USERNAME: medtrack
          SPRING_DATASOURCE_PASSWORD: medtrack
          MEDTRACK_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

  frontend-build-test:
    name: Frontend Build & Test (React 19 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend Distribution
        working-directory: ./frontend
        run: npm run build
